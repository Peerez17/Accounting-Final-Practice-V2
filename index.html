</style></head><body><a class="focus-link" href="#content">Skip to practice</a><header class="site-header"><div class="header-inner"><span class="site-name">Accounting Practice</span><nav aria-label="Main navigation"><button data-nav="home">Home</button><button data-nav="chapters">Chapters</button><button data-action="open-cash" data-nav-cash="true">Cash Flows</button></nav><div id="more-options"></div></div></header><main class="main" id="content" tabindex="-1"><div id="storage-warning" role="status"></div><div id="app"></div></main><footer class="footer"><button class="text-button" data-action="about-page">About These Questions</button></footer><div id="live" class="sr-only" role="status" aria-live="polite"></div><dialog class="reset-dialog" id="reset-dialog"><h2>Reset your progress?</h2><p>This clears answers, bookmarks, and progress saved in this browser. Your questions stay available.</p><div class="row"><button data-action="cancel-reset">Keep My Progress</button><button class="danger" data-action="confirm-reset">Reset Everything</button></div></dialog><script>
// Original practice templates aligned to the supplied course materials.
const bInt=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const bPick=(r,a)=>a[bInt(r,0,a.length-1)];
const bMoney=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const bNum=(id,label,answer,unit,explain)=>({id,label,answer,unit:unit||'dollars',explain,tolerance:unit==='units'?0:0.011});
const bChoice=(id,label,answer,choices,explain)=>({id,label,answer,choices,explain});
const bTable=(title,rows,headers=['Item','Amount'])=>({title,headers,rows});
const bProb=(intro,facts,fields,hints,solution='Use the shown formulas with the data in this scenario. Round final decimals to two places; carry unrounded intermediate values.')=>({intro,facts,fields,hints,solution});
const bAccounts=['Materials','Work in Process','Finished Goods','Manufacturing Overhead','Wages Payable','Accounts Payable','Accounts Receivable','Cash','Sales','Cost of Goods Sold','Accumulated Depreciation'];
const bJournal=(intro,facts,expected,explain,hints)=>({intro,facts,fields:[],hints,solution:explain,journal:{rows:expected.length,accounts:bAccounts,expected,explain}});
const BANK=[];
function bAdd(id,ch,topic,title,type,difficulty,source,generate,optional=false){BANK.push({id,ch,topic,title,type,difficulty,source,generate,optional});}
const bS14='Warren_FinMan_17e_PPT_CH14_Final.pptx';
const bS15='Ch15 Student.pptx';
const bS16='Chapter_16_Student_Discussion_Guide1.docx';
const bS20='ACC102_Chapter20_Discussion_Guide_Student.docx';
const bS22='Warren_FinMan_17e_PPT_CH22_LO1_2_3_4 student.pptx';

bAdd('14-horizontal',14,'Analytical methods','Track changes across years','Calculation','Foundation',bS14+' • slides 7–10',r=>{
 const old=bInt(r,20,70)*1000,change=bInt(r,-9,20)*1000,now=old+change;
 return bProb('Orion Supply compares this year’s sales with last year. Use last year as the base; a decrease must be negative.',[bTable('Net sales',[['Last year',bMoney(old)],['This year',bMoney(now)]])],[bNum('change','Dollar change',change,'dollars',`${bMoney(now)} − ${bMoney(old)} = ${bMoney(change)}.`),bNum('pct','Percentage change',change/old*100,'%',`${change} ÷ ${old} × 100 = ${(change/old*100).toFixed(2)}%.`)],['Find the change before computing the percentage.','(Current − prior) ÷ prior × 100.']);
});
bAdd('14-vertical',14,'Analytical methods','Build common-size percentages','Statement','Foundation',bS14+' • slides 11–15',r=>{
 const sales=bInt(r,30,80)*10000,cogs=sales*bInt(r,45,68)/100,opex=sales*bInt(r,12,24)/100;
 return bProb('Express each income statement item as a percentage of sales. There are no other revenues or expenses.',[bTable('Income statement',[['Sales',bMoney(sales)],['Cost of goods sold',bMoney(cogs)],['Operating expenses',bMoney(opex)]])],[bNum('cogs','Cost of goods sold / sales',cogs/sales*100,'%',`${cogs} ÷ ${sales} × 100 = ${cogs/sales*100}%.`),bNum('gp','Gross profit / sales',(sales-cogs)/sales*100,'%',`(${sales} − ${cogs}) ÷ ${sales} × 100.`),bNum('oi','Operating income / sales',(sales-cogs-opex)/sales*100,'%',`(${sales} − ${cogs} − ${opex}) ÷ ${sales} × 100.`)],['Every line shares the same denominator.','Income statement base = sales; balance sheet base = total assets.']);
});
bAdd('14-liquidity',14,'Liquidity','Working capital and quick assets','Calculation','Foundation',bS14+' • slides 20–26',r=>{
 const cash=bInt(r,3,8)*10000,inv=bInt(r,6,12)*10000,ar=bInt(r,5,9)*10000,temp=bInt(r,1,3)*10000,pre=bInt(r,1,4)*1000,cl=bInt(r,7,13)*10000,ca=cash+inv+ar+temp+pre,quick=cash+temp+ar;
 return bProb('Evaluate current liquidity. Enter ratios as multiples, not percentages.',[bTable('Current balances',[['Cash',bMoney(cash)],['Temporary investments',bMoney(temp)],['Net receivables',bMoney(ar)],['Inventory',bMoney(inv)],['Prepaids',bMoney(pre)],['Current liabilities',bMoney(cl)]])],[bNum('wc','Working capital',ca-cl,'dollars',`${ca} current assets − ${cl} current liabilities.`),bNum('current','Current ratio',ca/cl,'times',`${ca} ÷ ${cl} = ${(ca/cl).toFixed(2)} times.`),bNum('quick','Quick ratio',quick/cl,'times',`(${cash} + ${temp} + ${ar}) ÷ ${cl}. Inventory and prepaids are excluded.`)],['Quick assets exclude inventory and prepaid expenses.','Working capital = CA − CL; current ratio = CA/CL; quick ratio = quick assets/CL.']);
});
bAdd('14-receivables',14,'Liquidity','Receivables turnover and days','Calculation','Exam',bS14+' • slides 27–31',r=>{
 const start=bInt(r,6,15)*10000,end=bInt(r,6,15)*10000,avg=(start+end)/2,sales=avg*bInt(r,6,15);
 return bProb('Analyze receivables using a 365-day year and average receivables. All sales are on account.',[bTable('Annual activity',[['Sales',bMoney(sales)],['Beginning net receivables',bMoney(start)],['Ending net receivables',bMoney(end)]])],[bNum('avg','Average net receivables',avg,'dollars',`(${start} + ${end}) ÷ 2 = ${avg}.`),bNum('turn','Receivables turnover',sales/avg,'times',`${sales} ÷ ${avg} = ${sales/avg}.`),bNum('days','Days’ sales in receivables',avg/(sales/365),'days',`${avg} ÷ (${sales} ÷ 365) = ${(avg/(sales/365)).toFixed(2)} days.`)],['Use the average of beginning and ending balances.','Turnover = sales / average AR; days = average AR / (sales/365).']);
});
bAdd('14-inventory',14,'Liquidity','Inventory turnover and days','Calculation','Exam',bS14+' • slides 32–36',r=>{
 const start=bInt(r,10,24)*10000,end=bInt(r,12,25)*10000,avg=(start+end)/2,cogs=avg*bInt(r,3,7);
 return bProb('Analyze inventory efficiency using a 365-day year.',[bTable('Annual activity',[['Cost of goods sold',bMoney(cogs)],['Beginning inventory',bMoney(start)],['Ending inventory',bMoney(end)]])],[bNum('turn','Inventory turnover',cogs/avg,'times',`${cogs} ÷ ((${start} + ${end}) ÷ 2) = ${cogs/avg}.`),bNum('days','Days’ sales in inventory',avg/(cogs/365),'days',`${avg} ÷ (${cogs} ÷ 365) = ${(avg/(cogs/365)).toFixed(2)} days.`)],['Inventory is carried at cost, so use cost of goods sold.','Turnover = COGS/average inventory; days = 365/turnover.']);
});
bAdd('14-solvency',14,'Solvency','Debt support and interest coverage','Calculation','Exam',bS14+' • slides 39–45',r=>{
 const fixed=bInt(r,35,70)*10000,debt=bInt(r,10,22)*10000,total=debt+bInt(r,5,15)*10000,equity=bInt(r,40,75)*10000,interest=bInt(r,5,12)*1000,pretax=interest*bInt(r,6,15);
 return bProb('Calculate the three solvency ratios. Income before taxes already deducts interest expense.',[bTable('Selected figures',[['Net fixed assets',bMoney(fixed)],['Long-term liabilities',bMoney(debt)],['Total liabilities',bMoney(total)],['Stockholders’ equity',bMoney(equity)],['Income before taxes',bMoney(pretax)],['Interest expense',bMoney(interest)]])],[bNum('fa','Fixed assets / long-term liabilities',fixed/debt,'times',`${fixed} ÷ ${debt}.`),bNum('de','Liabilities / stockholders’ equity',total/equity,'times',`${total} ÷ ${equity}.`),bNum('tie','Times interest earned',(pretax+interest)/interest,'times',`(${pretax} + ${interest}) ÷ ${interest} = ${(pretax+interest)/interest}. Add back interest to pretax income.`)],['Interest coverage uses earnings before interest and taxes.','TIE = (income before tax + interest expense) / interest expense.']);
});
bAdd('14-assets',14,'Profitability','Asset turnover versus return on assets','Calculation','Exam',bS14+' • slides 50–53',r=>{
 const a0=bInt(r,80,120)*10000,a1=a0+bInt(r,5,15)*10000,i0=bInt(r,10,20)*10000,i1=bInt(r,10,20)*10000,sales=bInt(r,12,24)*100000,ni=bInt(r,8,15)*10000,int=bInt(r,5,15)*1000,opavg=(a0-i0+a1-i1)/2,allavg=(a0+a1)/2;
 return bProb('Use the course conventions: exclude long-term investments for asset turnover, but use all assets and add interest to net income for return on total assets.',[bTable('Comparative assets',[['Total assets',bMoney(a0),bMoney(a1)],['Long-term investments',bMoney(i0),bMoney(i1)]],['Item','Beginning','Ending']),bTable('Income',[['Sales',bMoney(sales)],['Net income',bMoney(ni)],['Interest expense',bMoney(int)]])],[bNum('turn','Asset turnover',sales/opavg,'times',`${sales} ÷ [((${a0} − ${i0}) + (${a1} − ${i1})) ÷ 2] = ${(sales/opavg).toFixed(2)}.`),bNum('roa','Return on total assets',(ni+int)/allavg*100,'%',`(${ni} + ${int}) ÷ ((${a0} + ${a1}) ÷ 2) × 100 = ${((ni+int)/allavg*100).toFixed(2)}%.`)],['The two measures use different asset bases in your slides.','Asset turnover = sales/average assets excluding LT investments; ROA = (NI+interest)/average total assets.']);
});
bAdd('14-equity',14,'Profitability','Returns on total and common equity','Calculation','Exam',bS14+' • slides 55–63',r=>{
 const eq0=bInt(r,50,80)*10000,eq1=eq0+bInt(r,2,10)*10000,pref=bInt(r,10,20)*10000,rate=bInt(r,4,8),pd=pref*rate/100,ni=bInt(r,8,15)*10000,avg=(eq0+eq1)/2;

/* Chapter 13: original transaction-derived indirect-method practice.
 * Reference: Chapter_13_Cash_Flow_Review.docx, Part 1, and its Instructor Key.
 * Amounts are whole dollars. rng is supplied by the application for reproducibility.
 */
function makeCashflow(rng) {
  const pick = (lo, hi, step = 1000) => (lo + Math.floor(rng() * (hi - lo + 1))) * step;
  const money = n => n < 0 ? '(' + Math.abs(n).toLocaleString('en-US') + ')' : n.toLocaleString('en-US');
  const signed = n => (n < 0 ? '− ' : '+ ') + '$' + money(Math.abs(n));
  const check = (ok, label) => { if (!ok) throw new Error('Cash-flow integrity check failed: ' + label); };
  let scenario;
  for (let attempt = 0; attempt < 100; attempt++) {
    // Build the opening ledger from actual historical transactions. No cash or
    // equity balancing plug is used. Historical profit is closed to RE.
    const h = {
      stock: pick(490, 560), debt: pick(180, 220), equipment: pick(430, 490),
      depreciation: pick(100, 130), revenue: pick(820, 900), receivables: pick(80, 110),
      inventoryPurchases: pick(520, 580), supplierPayable: pick(60, 85),
      cogs: pick(400, 450), salaries: pick(130, 155), salariesPayable: pick(12, 22),
      insurancePurchased: pick(22, 30), insuranceExpired: pick(12, 18), other: pick(65, 85)
    };
    const opening = {
      cash: h.stock + h.debt - h.equipment + h.revenue - h.receivables
        - h.inventoryPurchases + h.supplierPayable - h.salaries + h.salariesPayable
        - h.insurancePurchased - h.other,
      ar: h.receivables, inventory: h.inventoryPurchases - h.cogs,
      prepaid: h.insurancePurchased - h.insuranceExpired, equipment: h.equipment,
      accumDep: h.depreciation, ap: h.supplierPayable, salariesPayable: h.salariesPayable,
      debt: h.debt, stock: h.stock,
      retained: h.revenue - h.cogs - h.salaries - h.insuranceExpired - h.other - h.depreciation
    };
    const t = {
      sales: pick(900, 1200), cogs: pick(470, 620), salaries: pick(145, 185),
      insurance: pick(18, 28), otherOperating: pick(45, 75), depreciation: pick(32, 55),
      interest: pick(15, 28), taxes: pick(10, 24),
      deltaAR: pick(-25, 30), deltaInventory: pick(-25, 30), deltaPrepaid: pick(-4, 6),
      deltaAP: pick(-16, 20), deltaSalaries: pick(-6, 8),
      equipmentSoldCost: pick(60, 100), equipmentBought: pick(100, 250),
      borrowing: pick(30, 100), principalRepaid: pick(35, 110),
      stockIssued: pick(0, 10, 10000), dividends: pick(20, 65)
    };
    t.soldAccumDep = Math.floor(t.equipmentSoldCost / 1000 * (0.45 + rng() * 0.3)) * 1000;
    t.bookValue = t.equipmentSoldCost - t.soldAccumDep;
    t.gain = pick(3, 14) * (rng() < 0.5 ? -1 : 1);
    t.saleProceeds = t.bookValue + t.gain;
    t.operatingExpenses = t.salaries + t.insurance + t.otherOperating + t.depreciation;
    t.netIncome = t.sales - t.cogs - t.operatingExpenses + t.gain - t.interest - t.taxes;
    // Current-year cash is posted from cash receipts and payments, independently
    // of the indirect-method solution, providing a separate cross-check.
    t.collections = t.sales - t.deltaAR;
    t.inventoryPurchases = t.cogs + t.deltaInventory;
    t.supplierPayments = t.inventoryPurchases - t.deltaAP;
    t.salaryPayments = t.salaries - t.deltaSalaries;
    t.insurancePayments = t.insurance + t.deltaPrepaid;
    const directOperating = t.collections - t.supplierPayments - t.salaryPayments
      - t.insurancePayments - t.otherOperating - t.interest - t.taxes;
    const operating = t.netIncome + t.depreciation - t.gain - t.deltaAR
      - t.deltaInventory - t.deltaPrepaid + t.deltaAP + t.deltaSalaries;
    const investing = t.saleProceeds - t.equipmentBought;
    const financing = t.stockIssued + t.borrowing - t.principalRepaid - t.dividends;
    const change = operating + investing + financing;
    const ending = {
      cash: opening.cash + directOperating + t.saleProceeds - t.equipmentBought
        + t.stockIssued + t.borrowing - t.principalRepaid - t.dividends,
      ar: opening.ar + t.deltaAR, inventory: opening.inventory + t.deltaInventory,
      prepaid: opening.prepaid + t.deltaPrepaid,
      equipment: opening.equipment + t.equipmentBought - t.equipmentSoldCost,
      accumDep: opening.accumDep + t.depreciation - t.soldAccumDep,
      ap: opening.ap + t.deltaAP, salariesPayable: opening.salariesPayable + t.deltaSalaries,
      debt: opening.debt + t.borrowing - t.principalRepaid,
      stock: opening.stock + t.stockIssued, retained: opening.retained + t.netIncome - t.dividends
    };
    const assets = b => b.cash + b.ar + b.inventory + b.prepaid + b.equipment - b.accumDep;
    const funding = b => b.ap + b.salariesPayable + b.debt + b.stock + b.retained;
    if (opening.cash < 50000 || ending.cash < 15000 || t.netIncome <= 0) continue;
    check(assets(opening) === funding(opening), 'opening balance sheet');
    check(assets(ending) === funding(ending), 'ending balance sheet');
    check(operating === directOperating, 'indirect versus direct operating cash');
    check(opening.cash + change === ending.cash, 'cash reconciliation');
    check(ending.prepaid >= 0 && ending.accumDep >= 0 && ending.accumDep < ending.equipment, 'asset balances');
    scenario = {opening, ending, t, h, operating, investing, financing, change,
      directOperating, openingAssets: assets(opening), endingAssets: assets(ending),
      openingFunding: funding(opening), endingFunding: funding(ending)};
    break;
  }
  if (!scenario) throw new Error('Unable to generate a valid cash-flow scenario.');
  const s = scenario, o = s.opening, e = s.ending, t = s.t;
  const names = ['Northstar Cycle Company', 'Cedar Trail Outfitters', 'Harbor Workshop Corporation', 'Juniper Equipment Company', 'Copper Ridge Supply'];
  const company = names[Math.floor(rng() * names.length)];
  const fields = [];
  const field = (id, label, answer, section, explain) => fields.push({id: 'cf_' + id, label, answer, unit: '$', section, explain, tolerance: 0.005});
  field('income', 'Net income', t.netIncome, 'Operating', `Start with the income statement's net income of $${money(t.netIncome)}.`);
  field('dep', 'Depreciation adjustment', t.depreciation, 'Operating', `Add back $${money(t.depreciation)}: depreciation reduced net income without a current cash payment.`);
  field('gain', (t.gain >= 0 ? 'Gain' : 'Loss') + ' on equipment sale adjustment', -t.gain, 'Operating', `${t.gain >= 0 ? 'Subtract the gain' : 'Add the loss'} of $${money(Math.abs(t.gain))}; the full $${money(t.saleProceeds)} proceeds belong in investing activities.`);
  const working = [
    ['ar', 'Accounts Receivable', t.deltaAR, -t.deltaAR, o.ar, e.ar, 'asset'],
    ['inv', 'Inventory', t.deltaInventory, -t.deltaInventory, o.inventory, e.inventory, 'asset'],
    ['prepaid', 'Prepaid Insurance', t.deltaPrepaid, -t.deltaPrepaid, o.prepaid, e.prepaid, 'asset'],
    ['ap', 'Accounts Payable', t.deltaAP, t.deltaAP, o.ap, e.ap, 'liability'],
    ['salary', 'Accrued Salaries Payable', t.deltaSalaries, t.deltaSalaries, o.salariesPayable, e.salariesPayable, 'liability']
  ];
  for (const [id, label, delta, adj, begin, end, kind] of working) {
    const movement = delta === 0 ? 'No change' : delta > 0 ? 'Increase' : 'Decrease';
    const action = adj === 0 ? 'No adjustment is needed' : adj > 0 ? 'Add this change' : 'Subtract this change';
    field(id, label + ' adjustment', adj, 'Operating', `${label}: $${money(end)} − $${money(begin)} = ${delta < 0 ? '−' : ''}$${money(Math.abs(delta))}. ${movement} in an operating ${kind}. ${action}; operating assets move opposite to their change, while operating liabilities move with their change.`);
  }
  field('cfo', 'Net cash from operating activities', s.operating, 'Operating', `$${money(t.netIncome)} ${signed(t.depreciation)} ${signed(-t.gain)} ${signed(-t.deltaAR)} ${signed(-t.deltaInventory)} ${signed(-t.deltaPrepaid)} ${signed(t.deltaAP)} ${signed(t.deltaSalaries)} = $${money(s.operating)}.`);
  field('sale', 'Cash proceeds from equipment sale', t.saleProceeds, 'Investing', `Report the entire $${money(t.saleProceeds)} cash receipt, not the gain or book value.`);
  field('purchase', 'Cash paid for equipment', -t.equipmentBought, 'Investing', `Equipment purchased for cash is an investing outflow: ($${money(t.equipmentBought)}). Enter a negative amount.`);
  field('cfi', 'Net cash from investing activities', s.investing, 'Investing', `$${money(t.saleProceeds)} − $${money(t.equipmentBought)} = $${money(s.investing)}.`);
  field('stock', 'Cash from issuing common stock', t.stockIssued, 'Financing', `The company received $${money(t.stockIssued)} from owners. A zero amount is a valid answer when no stock was issued.`);
  field('borrow', 'Cash from long-term borrowing', t.borrowing, 'Financing', `Report $${money(t.borrowing)} as a financing inflow; do not net it against principal repayments in this row.`);
  field('repay', 'Cash paid to repay note principal', -t.principalRepaid, 'Financing', `Principal paid is a financing outflow of ($${money(t.principalRepaid)}). Interest is already included in operating activities through net income.`);

  balanceRows.push(['Total liabilities and stockholders’ equity', money(s.endingFunding), money(s.openingFunding)]);
  return {

    support: [

      {label: 'Reconciled ending Accumulated Depreciation', answer: e.accumDep, explain: `$${money(o.accumDep)} + depreciation $${money(t.depreciation)} − accumulated depreciation removed $${money(t.soldAccumDep)} = $${money(e.accumDep)}.`}

function parseNumber(raw){let s=String(raw??'').trim();if(!s)return null;let par=s.startsWith('(')&&s.endsWith(')');if(par)s=s.slice(1,-1).trim();s=s.replace(/[$,\s]/g,'').replace(/%$/,'');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return null;const n=Number(s);if(!Number.isFinite(n)||par&&n<0)return null;return par?-n:n}
function fieldCorrect(field,raw){if(typeof field.answer==='number'){const n=parseNumber(raw);return n!==null&&Math.abs(n-field.answer)<=(field.tolerance??.011)}return String(raw??'').trim().toLowerCase()===String(field.answer).trim().toLowerCase()}
function fieldIssue(r,f,raw){
 if(!String(raw??'').trim())return '— Not answered yet.';
 if(f.choices)return r.ch===14?'Not quite. Is the question about short-term cash, long-term debt, or profit?':'Not quite. Review the situation and choose the category that best fits. You can ask for a hint.';
 if(typeof f.answer==='number'&&parseNumber(raw)===null)return '↻ Enter a number, not a formula. Commas, dollars, and parentheses are accepted.';
 if(typeof f.answer==='number'&&f.answer!==0&&Math.abs(parseNumber(raw)+f.answer)<.011)return '↻ The magnitude matches, but the sign is reversed. Check whether this is an addition or a deduction.';
 if(r.ch===13&&f.section==='Operating')return '↻ Reverse noncash gains/expenses. Operating asset changes have the opposite sign; operating liability changes keep their sign.';
 if(r.ch===13&&f.section==='Investing')return '↻ Use the full cash proceeds for a sale, not book value or the gain. Equipment purchases are outflows.';
 if(r.ch===16&&/overhead|job/i.test(r.topic+' '+r.title))return '↻ A job receives applied overhead (rate × its actual activity). Actual overhead is recorded separately.';
 if(r.ch===22&&/budget/i.test(r.topic))return '↻ For production or purchases, add the desired ending inventory and subtract beginning inventory. Carry unrounded figures forward.';
 if(r.ch===20&&/break|target/i.test(r.topic))return '↻ Use unit contribution margin for units and the contribution margin ratio for dollars. Round required units upward.';
 return '↻ Not quite. Check the setup, units, sign, and rounding. Try a hint if you need a nudge.';
}
function gradeJournal(record){const j=record.p.journal;if(!j)return true;const actual=new Map();let valid=true,used=0;for(const row of record.journal){if(!row)continue;const has=!!(row.account||String(row.debit??'').trim()||String(row.credit??'').trim());if(!has)continue;used++;const debit=String(row.debit??'').trim()?parseNumber(row.debit):0,credit=String(row.credit??'').trim()?parseNumber(row.credit):0;if(!row.account||debit===null||credit===null||debit<0||credit<0||debit>0&&credit>0){valid=false;continue}const a=actual.get(row.account)||[0,0];a[0]+=debit;a[1]+=credit;actual.set(row.account,a)}const expected=new Map();for(const row of j.expected){const a=expected.get(row.account)||[0,0];a[0]+=row.debit||0;a[1]+=row.credit||0;expected.set(row.account,a)}if(!valid||!used||actual.size!==expected.size)return false;for(const [key,v] of expected){const a=actual.get(key);if(!a||Math.abs(a[0]-v[0])>.011||Math.abs(a[1]-v[1])>.011)return false}return true}

function mistakes(){const missed=state.stats.filter(s=>s.firstCorrect<s.total&&!s.completed);return header('Turn the tricky parts into strengths.','Revisit exact scenarios you have not yet completed correctly, or get fresh numbers for the same skill.','REVIEW MISTAKES')+(missed.length?`<div class="library-list">${missed.map(s=>`<article class="library-item"><div><span class="badge">CH. ${s.ch} · ${s.assisted?'ASSISTED':'FIRST ATTEMPT'}</span><h3>${esc(s.title)}</h3><small>${s.firstCorrect}/${s.total} parts correct on first check · ${esc(s.topic)}</small></div><div class="row">${button('Retry original','missed-open','small',`data-uid="${s.uid}"`)}${button('New variant','missed-similar','small ghost',`data-id="${s.id}"`)}</div></article>`).join('')}</div>`:`<div class="empty"><div class="eyebrow">ROOM TO GROW</div><h2>${state.stats.length?'You’ve worked through your mistakes.':'Your review list starts here.'}</h2><p>Unfinished problems with missed answers will appear here automatically. A fully correct submission clears the problem from this list.</p>${button('Start practicing','setup','primary')}</div>`)}
function progress(){const s=summary(),eligible=state.stats.filter(s=>!s.assisted),topics=[...new Set(state.stats.map(s=>'Ch. '+s.ch+' · '+s.topic))];const assisted=state.stats.filter(s=>s.assisted).length;return header('See what’s getting stronger.','Honest feedback on your first attempts, without counting revealed answers as mastery.','YOUR PROGRESS')+`<section class="stats"><div class="stat"><span class="muted">First-attempt accuracy</span><strong>${s.accuracy}</strong><small>${s.correct} / ${s.total} unassisted answer parts</small></div><div class="stat"><span class="muted">Completed problems</span><strong>${s.completed}</strong><small>Fully correct submissions, including retries</small></div><div class="stat"><span class="muted">Assisted attempts</span><strong>${assisted}</strong><small>Excluded from first-attempt accuracy</small></div></section><section class="panel"><h2>Accuracy by chapter</h2><div class="bars">${[14,15,16,20,22,13].map(ch=>{const a=eligible.filter(s=>s.ch===ch),total=a.reduce((n,s)=>n+s.total,0),correct=a.reduce((n,s)=>n+s.firstCorrect,0),pct=total?Math.round(100*correct/total):0;return `<div class="bar-row"><span>Chapter ${ch} · ${CHAPTERS[ch]?.title||'Cash-flow lab'}</span><small>${total?pct+'%':'No checks'}</small><div class="progress-track"><span style="width:${pct}%"></span></div></div>`}).join('')}</div></section>${topics.length?`<section class="panel"><h2>Topic detail</h2><div class="table-wrap"><table class="results-table"><thead><tr><th>Topic</th><th>First attempt</th><th>Completed</th></tr></thead><tbody>${topics.map(t=>{const a=state.stats.filter(s=>'Ch. '+s.ch+' · '+s.topic===t),u=a.filter(s=>!s.assisted),total=u.reduce((n,s)=>n+s.total,0),correct=u.reduce((n,s)=>n+s.firstCorrect,0);return `<tr><td>${esc(t)}</td><td>${total?correct+' / '+total:'Assisted only'}</td><td>${a.filter(s=>s.completed).length}</td></tr>`}).join('')}</tbody></table></div></section>`:''}${state.stats.some(s=>s.ch===13)?`<section class="panel"><h2>Cash-flow section performance</h2><p>${state.stats.filter(s=>s.ch===13).length} scenarios checked. First unassisted check of each section:</p><div class="bars">${['Operating','Investing','Financing','Reconciliation'].map(sec=>{const a=state.stats.filter(s=>s.ch===13&&s.sections[sec]&&!s.sections[sec].assisted).map(s=>s.sections[sec]),total=a.reduce((n,s)=>n+s.total,0),correct=a.reduce((n,s)=>n+s.correct,0);return `<div class="bar-row"><span>${sec}</span><small>${total?Math.round(100*correct/total)+'%':'—'}</small><div class="progress-track"><span style="width:${total?100*correct/total:0}%"></span></div></div>`}).join('')}</div></section>`:''}<section class="panel row spread"><div><h3 style="margin:0">Your data, on this browser</h3><small>No account, syncing, or uploads. Local-file and GitHub Pages progress may be stored separately.</small></div>${button('Reset progress','reset','danger ghost')}</section>`}
function handleAnswer(el){const r=active();if(!r)return;if(el.dataset.answer){r.answers[el.dataset.answer]=el.value;if(r.feedback)delete r.feedback[el.dataset.answer];r.fullChecked=false;el.removeAttribute?.('aria-invalid');el.removeAttribute?.('aria-describedby');el.closest('.answer-row')?.classList.remove('ok','bad');el.closest('.answer-row')?.querySelector('.answer-feedback')?.remove()}if(el.dataset.jrow!==undefined){const i=+el.dataset.jrow;r.journal[i]??={};r.journal[i][el.dataset.jfield]=el.value;if(r.feedback)delete r.feedback.journal}const panel=el.closest('.panel');panel?.querySelector('.notice[role="status"]')?.remove();save()}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){if(b.dataset.nav==='practice')state.showSetup=false;go(b.dataset.nav);return}const a=b.dataset.action,r=active(),s=state.session;if(!a)return;
if(['library','cash','progress'].includes(a)){go(a);return}

const CASH_STEPS=['Operating','Investing','Financing','Reconciliation'];
const CASH_TITLES=['Operating Activities','Investing Activities','Financing Activities','Check the Cash Balance'];
const SIMPLE_NAMES={14:'Understanding Financial Statements',15:'Understanding Costs',16:'Job Order Costing',20:'Costs, Profit & Break-Even',22:'Preparing Budgets'};
function header(title,desc){return `<header class="page-heading"><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</header>`}
function chapterButtons(){return `<div class="chapter-list">${Object.entries(SIMPLE_NAMES).map(([ch,name])=>button(`<span>Chapter ${ch}</span><strong>${name}</strong>`,'chapter','chapter-button',`data-ch="${ch}"`)).join('')}</div>`}
function home(){return header('What would you like to practice?','Choose a chapter or work through a complete cash-flow statement.')+`${hasUnfinished()?`<div class="continue-row">${button('Continue where I left off','continue','quiet')}</div>`:''}<div class="home-options"><section class="panel"><h2>Practice by Chapter</h2><p>Pick a chapter to start a problem.</p>${chapterButtons()}</section><section class="panel cash-choice"><h2>Practice a Full Cash-Flow Problem</h2><p>Chapter 13, in four steps. Prepare a complete statement and check your answers along the way.</p>${button(state.cash?'Continue Cash-Flow Problem':'Start Cash-Flow Problem','open-cash','primary')}<ol class="step-outline">${CASH_TITLES.map(t=>`<li>${t}</li>`).join('')}</ol></section></div>`}
function chapters(){return header('Choose a chapter','Select a chapter to start practicing right away.')+`<section class="panel narrow">${chapterButtons()}</section>`}
function hasUnfinished(){return Boolean(state.session?.queue.some(r=>!state.stats.find(s=>s.uid===r.uid)?.completed)||state.cash&&!state.stats.find(s=>s.uid===state.cash.uid)?.completed)}
function archiveSession(){if(state.session){state.savedSessions??=[];const key=state.session.queue[0]?.uid;if(key){const i=state.savedSessions.findIndex(s=>s.queue[0]?.uid===key),copy=JSON.parse(JSON.stringify(state.session));if(i<0)state.savedSessions.push(copy);else state.savedSessions[i]=copy}}}
function archiveCash(){if(state.cash){state.savedCash??=[];const i=state.savedCash.findIndex(r=>r.uid===state.cash.uid),copy=JSON.parse(JSON.stringify(state.cash));if(i<0)state.savedCash.push(copy);else state.savedCash[i]=copy}}
function go(page){state.page=page;if(page==='practice'||page==='cash')state.lastStudy=page;save();render();window.scrollTo({top:0,behavior:'instant'});$('#content').focus({preventScroll:true})}
function continueWork(){let page=state.lastStudy;if(!['practice','cash'].includes(page)||page==='practice'&&!state.session||page==='cash'&&!state.cash)page=state.session?'practice':'cash';state.showSetup=false;go(page)}
function optionsMenu(){const r=(state.page==='cash'||state.page==='practice'&&!state.showSetup)?active():null;return `<details class="more-menu"><summary>More Options</summary><div class="menu-items">${button('Search & Filter Questions','library')}${button('Set Up a Quiz or Custom Session','setup')}${button('Bookmarks','bookmarks-page')}${button('Review Mistakes','mistakes-page')}${button('Progress','progress')}${button('Saved Work','saved-page')}${r?button(state.bookmarks.some(b=>b.uid===r.uid)?'Remove This Bookmark':'Bookmark This Problem','bookmark'):''}${r&&state.page==='cash'?`<label class="menu-check"><input type="checkbox" id="cash-exam" ${r.exam?'checked':''}> Exam mode</label>${button('Start a New Cash-Flow Problem','new-cash')}`:''}${r?.p.support?.length?button('Optional Scratch Work','scratch'):''}${button('About These Questions','about-page')}</div></details>`}
function about(){const r=state.lastStudy==='cash'?state.cash:state.session?.queue[state.session.index];return header('About These Questions','Original practice problems based on your accounting study materials.')+`${r?`<section class="panel"><h2>Current problem</h2><p>${esc(r.title)}</p><p>${esc(r.source)}</p><p class="muted">Practice variant: ${r.seed.toString(36).toUpperCase()}</p></section>`:''}${coverage().replace('<details class="panel coverage">','<details class="panel coverage" open>').replace('What’s covered · based on your study materials','Course coverage').replace('Source names appear beside each practice problem.','Source references appear on this page.')}<section class="panel"><h2>Saving your work</h2><p>Answers and progress save automatically in this browser. Keep using the same browser and website address to continue your work. Updating this file on the same website keeps your saved data.</p></section>`}
function bookmarksPage(){return header('Bookmarked Problems','Open a saved problem with its original numbers.')+`<div class="library-list">${state.bookmarks.map(b=>`<article class="library-item"><div><small>Chapter ${b.ch}</small><h2>${esc(b.title)}</h2></div><div class="row">${button('Open Problem','bookmark-open','',`data-uid="${b.uid}"`)}${button('Remove Bookmark','bookmark-remove','quiet',`data-uid="${b.uid}"`)}</div></article>`).join('')||'<p>No bookmarks yet. While practicing, open More Options and choose Bookmark This Problem.</p>'}</div>`}
function savedPage(){const sessions=[...(state.savedSessions||[])],cashRecords=[...(state.savedCash||[])];return header('Saved Work','Previous sessions stay here when you start something new.')+`<div class="library-list">${state.session?`<article class="library-item"><h2>Current chapter practice</h2>${button('Continue','resume')}</article>`:''}${state.cash?`<article class="library-item"><h2>Current cash-flow problem</h2>${button('Continue','open-cash')}</article>`:''}${sessions.map((s,i)=>`<article class="library-item"><div><h2>${esc(s.queue[s.index]?.title||'Chapter practice')}</h2><small>Question ${s.index+1} of ${s.queue.length}</small></div>${button('Open Session','restore-session','',`data-index="${i}"`)}</article>`).join('')}${cashRecords.map((r,i)=>`<article class="library-item"><div><h2>Cash-flow problem</h2><small>${esc(r.p.intro.split(' · ')[0])} · Step ${(r.step||0)+1} of 4</small></div>${button('Open Problem','restore-cash','',`data-index="${i}"`)}</article>`).join('')}${!state.session&&!state.cash&&!sessions.length&&!cashRecords.length?'<p>Your saved work will appear here after you start practicing.</p>':''}</div>`}
function dataPanel(r){const mobile=typeof window!=='undefined'&&window.innerWidth<=760;const open=r.infoOpen??(!mobile||r.ch!==13);return `<details class="panel problem-info" id="problem-info" ${open?'open':''}><summary>View Problem Information</summary><div class="problem-content"><h2>1. Read the problem</h2><p class="scenario">${esc(r.p.intro)}</p>${r.p.facts.map(f=>`<section><h3>${esc(f.title)}</h3><div class="table-wrap" tabindex="0" role="region" aria-label="${esc(f.title)}"><table><thead><tr>${f.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${f.rows.map(row=>`<tr>${row.map((v,i)=>`<${i?'td':'th scope="row"'}>${typeof v==='number'?money(v):esc(v)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</tbody></table></div></section>`).join('')}${r.p.notes?.length?`<h3>Additional information</h3><ol class="notes">${r.p.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>`:''}</div></details>`}
function fieldMarkup(r,f){const feedback=r.feedback&&Object.hasOwn(r.feedback,f.id)?r.feedback[f.id]:null;const val=r.answers[f.id]??'';const unit=f.unit||'';const fi=esc(f.id);return `<div class="answer-row ${feedback===true?'ok':feedback===false?'bad':''}"><label for="answer-${fi}">${esc(f.label)}${unit?` <span class="unit">(${esc(unit)})</span>`:''}</label>${f.choices?`<select id="answer-${fi}" data-answer="${fi}" ${feedback===false?'aria-invalid="true"':''} ${feedback!==null?`aria-describedby="feedback-${fi}"`:''}><option value="">Choose an answer</option>${f.choices.map(c=>`<option value="${esc(c)}"${attr(val,c)}>${esc(c)}</option>`).join('')}</select>`:`<input class="numeric" id="answer-${fi}" data-answer="${fi}" inputmode="decimal" autocomplete="off" placeholder="Your answer" value="${esc(val)}" ${feedback===false?'aria-invalid="true"':''} ${feedback!==null?`aria-describedby="feedback-${fi}"`:''}>`}${feedback!==null?`<div class="answer-feedback ${feedback?'correct':'incorrect'}" id="feedback-${fi}">${feedback?'✓ Correct':esc(fieldIssue(r,f,val))}</div>`:''}</div>`}
function scratchMarkup(r){return `<details class="scratch panel" id="scratch-work" ${state.scratchOpen?'open':''}><summary>Optional Scratch Work</summary><p>Use these fields to work out supporting calculations. They are not scored.</p>${r.p.support.map((s,i)=>`<label class="field-label" for="support-${i}">${esc(s.label)}</label><input id="support-${i}" data-answer="support-${i}" inputmode="decimal" value="${esc(r.answers['support-'+i]??'')}">`).join('')}${r.revealed?r.p.support.map(s=>`<p><strong>${esc(s.label)}: ${money(s.answer)}</strong><br>${esc(s.explain)}</p>`).join(''):''}</details>`}
function worksheet(r){const exam=isExam(),canHelp=!exam||released(),cashProblem=r.ch===13,step=r.step||0,sec=CASH_STEPS[step];const fields=cashProblem?r.p.fields.filter(f=>f.section===sec):r.p.fields;const feedbackEntries=fields.filter(f=>r.feedback&&Object.hasOwn(r.feedback,f.id)).map(f=>r.feedback[f.id]);if(r.p.journal&&r.feedback?.journal!==undefined)feedbackEntries.push(r.feedback.journal);const checked=feedbackEntries.length>0;const allFeedback=r.feedback?Object.values(r.feedback):[];return `<section class="panel answer-panel"><h2>2. Enter your answers</h2>${cashProblem?`<p class="step-label">${CASH_TITLES[step]}</p>`:''}${fields.map(f=>fieldMarkup(r,f)).join('')}${r.p.journal?journalMarkup(r):''}<details class="answer-help"><summary>How to enter answers</summary><p>Commas and dollar signs are fine. Use a minus sign or parentheses for deductions. Enter 25 for 25%. Round money and ratios to two decimals unless the question says otherwise. Required whole units round up.</p></details><div class="check-area"><h2>3. Check your work</h2>${checked?`<div class="notice ${feedbackEntries.every(Boolean)?'success':''}" role="status">${feedbackEntries.every(Boolean)?'✓ These answers are correct.':`${feedbackEntries.filter(Boolean).length} of ${feedbackEntries.length} correct. Keep the correct answers and try the others again.`}</div>`:''}${cashProblem&&r.fullChecked?`<div class="notice full-result" role="status">${allFeedback.length===r.p.fields.length&&allFeedback.every(Boolean)?'✓ Your entire statement is correct.':`Full statement: ${allFeedback.filter(Boolean).length} of ${r.p.fields.length} answers correct. Review any steps that need another try.`}</div>`:''}<div class="actions">${canHelp?button('Check My Answers',cashProblem?'section-check':'check','primary',cashProblem?`data-section="${sec}"`:''):''}${canHelp?button(r.hint>=2?'Hints Shown':r.hint?'Give Me Another Hint':'Give Me a Hint','hint','',r.hint>=2?'disabled':''):''}${!cashProblem?button('Next Problem','next',canHelp?'':'primary'):''}${cashProblem&&step===3?button('Submit Entire Statement','check',exam?'primary':''):''}</div>${exam&&!released()?'<p class="muted">Quiz mode: answers are saved. Feedback is available after you submit.</p>':''}${r.hint&&canHelp?`<div class="hint">${r.p.hints.slice(0,r.hint).map(h=>`<p>${esc(h)}</p>`).join('')}</div>`:''}${canHelp&&(r.checks>0||r.hint>0)?`<div class="secondary-actions">${button(r.revealed?'Hide Explanation':'Show Me How to Solve It','solution','text-button')}${!cashProblem?button('Practice Another Like This','similar','text-button'):''}</div>`:''}${r.revealed&&canHelp?solutionMarkup(cashProblem?{...r,p:{...r.p,fields,solution:r.fullChecked?r.p.solution:'Follow each calculation below for this step.'}}:r):''}</div>${cashProblem?`<div class="step-navigation">${button('Back','cash-back','',step===0?'disabled':'')}${step<3?button('Next','cash-next','primary'):button('Review from Step 1','cash-first')}</div>`:''}</section>${cashProblem&&state.scratchOpen?scratchMarkup(r):''}`}
function practice(){if(state.showSetup)return setup();if(!state.session)return chapters();const s=state.session,r=active();return header(esc(r.title),`Chapter ${r.ch} · ${esc(SIMPLE_NAMES[r.ch]||r.topic)}`)+`${s.mode==='quiz'?`<div class="panel quiz-nav"><p>Quiz · Question ${s.index+1} of ${s.queue.length}</p><div class="row">${s.queue.map((q,i)=>button(String(i+1),'question-index','small '+(i===s.index?'current':''),`data-index="${i}" aria-label="Question ${i+1}"`)).join('')}${!s.submitted?button('Submit Quiz','submit-quiz','primary'):button('View Quiz Results','quiz-results')}</div></div>`:''}${s.submitted&&state.showResults?quizResults():''}<div class="workspace">${dataPanel(r)}<div>${worksheet(r)}${s.index>0?button('Previous Problem','previous','text-button'):''}</div></div>`}
function cash(){if(!state.cash)return header('Practice a Full Cash-Flow Problem','Work through Chapter 13 one step at a time.')+`<section class="panel narrow"><ol class="step-outline">${CASH_TITLES.map(t=>`<li>${t}</li>`).join('')}</ol>${button('Start Cash-Flow Problem','new-cash','primary')}</section>`;const r=state.cash,step=r.step||0;return header('Statement of Cash Flows','Chapter 13 · Indirect method · All amounts in dollars')+`<div class="cash-progress"><p>Step ${step+1} of 4: <strong>${CASH_TITLES[step]}</strong></p><ol class="step-indicator" aria-label="Cash-flow steps">${CASH_TITLES.map((t,i)=>`<li ${i===step?'aria-current="step"':''}>${button(`<span>${i+1}</span> ${t}`,'cash-step',i===step?'current':'',`data-step="${i}"`)}</li>`).join('')}</ol></div><div class="workspace">${dataPanel(r)}<div>${worksheet(r)}${r.fullChecked?button('Practice Another Cash-Flow Problem','new-cash','text-button'):''}</div></div>`}
function check(section){const r=active();if(!r)return;const results=grade(r,section);r.feedback={...(r.feedback||{}),...results};r.checks++;recordStats(r,results,!!section);if(state.page==='cash'&&!section){r.submitted=true;r.fullChecked=true}save();render();const c=Object.values(results).filter(Boolean).length;toast(c===Object.keys(results).length?'All checked answers are correct.':`${c} of ${Object.keys(results).length} correct. Your answers are kept so you can fix the others.`)}
function render(){const pages={home,chapters,practice,library,mistakes,cash,progress,about,bookmarks:bookmarksPage,saved:savedPage};if(!pages[state.page])state.page='home';$('#app').innerHTML='<div class="page">'+pages[state.page]()+'</div>';$('#more-options').innerHTML=optionsMenu();$$('[data-nav]').forEach(b=>{const current=b.dataset.nav===state.page||b.dataset.nav==='chapters'&&state.page==='practice';b.classList.toggle('active',current);if(current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const cashNav=document.querySelector("[data-nav-cash]");if(cashNav){cashNav.classList.toggle('active',state.page==='cash');if(state.page==='cash')cashNav.setAttribute('aria-current','page');else cashNav.removeAttribute('aria-current')}storageNotice()}
document.addEventListener('toggle',e=>{if(e.target.id==='problem-info'&&active()){active().infoOpen=e.target.open;save()}},true);

render();
/* Public, read-only testing surface for local QA. */
globalThis.LedgerTest={parseNumber,fieldCorrect,gradeJournal,rngFor,BANK,makeCashflow,grade};

</script></body></html>
